    <script>

        var $root = $('html, body');
        $(document).ready(function () {
            // Delegated, so it works for gallery items rendered by js/content.js
            $(document).on("click", ".hidden-button-left", function () {
                var scrolable = $(this).siblings(".scrollable").first();
                var parentWidth = scrolable.parent().width()
                var newLeft = parseInt(scrolable.css('left')) + parentWidth;
                newLeft = newLeft > 0 ? 0 : newLeft;
                scrolable.css({ 'left': newLeft });
            });
            $(document).on("click", ".hidden-button-right", function () {
                var scrolable = $(this).siblings(".scrollable").first();
                var parentWidth = scrolable.parent().width();
                var newLeft = parseInt(scrolable.css('left')) - parentWidth;
                newLeft = newLeft < parentWidth - scrolable.width() ? parentWidth - scrolable.width() : newLeft;
                scrolable.css({ 'left': newLeft });
            });
            // Drag-to-scroll for the art store rows + tap/click-to-enlarge overlay.
            // Uses pointer events (mouse + touch) instead of "click", which is
            // unreliable on iOS for plain images and double-fires after a tap.
            var TAP_SLOP = 10;
            var press = null;
            var overlay = $("#image-overlay");
            function clampLeft(row, left) {
                var min = Math.min(0, row.parent().width() - row.width());
                return Math.max(min, Math.min(0, left));
            }
            function openOverlay(img) {
                overlay.find("img").attr({ src: img.attr("src"), alt: img.attr("alt") });
                overlay.addClass("open");
            }
            var suppressClickUntil = 0;
            function closeOverlay() {
                overlay.removeClass("open");
                suppressClickUntil = Date.now() + 500;
            }
            // Swallow the delayed click a touch tap fires after closing the overlay
            document.addEventListener("click", function (e) {
                if (Date.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); }
            }, true);
            $(document).on("pointerdown", function (e) {
                if (e.button !== 0) return;
                var row = $(e.target).closest(".gallery-item .scrollable");
                press = {
                    x: e.clientX, y: e.clientY, target: e.target, moved: false,
                    row: row.length ? row : null,
                    startLeft: row.length ? (parseInt(row.css("left")) || 0) : 0
                };
                if (press.row) press.row.addClass("dragging");
            });
            $(document).on("pointermove", function (e) {
                if (!press) return;
                var dx = e.clientX - press.x, dy = e.clientY - press.y;
                if (Math.abs(dx) > TAP_SLOP || Math.abs(dy) > TAP_SLOP) press.moved = true;
                if (press.row && press.moved) press.row.css("left", clampLeft(press.row, press.startLeft + dx));
            });
            $(document).on("pointerup pointercancel", function (e) {
                if (!press) return;
                var p = press;
                press = null;
                if (p.row) p.row.removeClass("dragging");
                if (p.moved || e.type !== "pointerup") return;
                var t = $(p.target);
                if (overlay.hasClass("open")) {
                    if (t.closest("#image-overlay").length) closeOverlay();
                    return;
                }
                var img = t.closest(".gallery-item .scrollable img, #games-section .game-img-container img");
                if (!img.length) {
                    var tool = t.closest("#tools-section .images-list .tool-img");
                    if (tool.length) img = tool.find("img").first();
                }
                if (img.length) {
                    e.preventDefault();
                    openOverlay(img);
                }
            });
            $(document).on("keydown", function (e) {
                if (e.key === "Escape") closeOverlay();
            });
            $('a[href^="#"]').click(function () {
                $root.animate({
                    scrollTop: $($.attr(this, 'href')).offset().top
                }, 3000);

                return false;
            });
            $("img").attr('draggable', 'False');
        });
    </script>
</head>
