    <link href="css/games-section.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="js/site-data.js" defer></script>
    <script src="js/content.js" defer></script>
    <script>

        var $root = $('html, body');
        $(document).ready(function () {
            // Delegated, so it works for gallery items rendered by js/content.js
            $(document).on("click", ".hidden-button-left", function () {
                var scrolable = $(this).siblings(".scrollable").first();
                var parentWidth = scrolable.parent().width()
                var newLeft = parseInt(scrolable.css('left')) + parentWidth;
                newLeft = newLeft > 0 ? 0 : newLeft;
                scrolable.css({ 'left': newLeft });
            });
            $(document).on("click", ".hidden-button-right", function () {
                var scrolable = $(this).siblings(".scrollable").first();
                var parentWidth = scrolable.parent().width();
                var newLeft = parseInt(scrolable.css('left')) - parentWidth;
                newLeft = newLeft < parentWidth - scrolable.width() ? parentWidth - scrolable.width() : newLeft;
                scrolable.css({ 'left': newLeft });
            });
            // Drag-to-scroll for the art store rows + click-to-enlarge overlay
            var drag = null;
            function clampLeft(row, left) {
                var min = Math.min(0, row.parent().width() - row.width());
                return Math.max(min, Math.min(0, left));
            }
            $(document).on("pointerdown", ".gallery-item .scrollable", function (e) {
                if (e.button !== 0) return;
                drag = { row: $(this), startX: e.clientX, startLeft: parseInt($(this).css("left")) || 0, moved: false };
                drag.row.addClass("dragging");
            });
            $(document).on("pointermove", function (e) {
                if (!drag) return;
                var dx = e.clientX - drag.startX;
                if (Math.abs(dx) > 5) drag.moved = true;
                if (drag.moved) drag.row.css("left", clampLeft(drag.row, drag.startLeft + dx));
            });
            $(document).on("pointerup pointercancel", function (e) {
                if (!drag) return;
                var d = drag;
                drag = null;
                d.row.removeClass("dragging");
                if (!d.moved && e.type === "pointerup") {
                    var img = $(e.target).closest(".scrollable img");
                    if (img.length) {
                        $("#image-overlay img").attr({ src: img.attr("src"), alt: img.attr("alt") });
                        $("#image-overlay").addClass("open");
                    }
                }
            });
            // Games and tools preview images also open in the overlay
            $(document).on("click", "#tools-section .images-list .tool-img, #games-section .game-img-container img", function () {
                var src = $(this).is("img") ? $(this) : $(this).find("img").first();
                $("#image-overlay img").attr({ src: src.attr("src"), alt: src.attr("alt") });
                $("#image-overlay").addClass("open");
            });
            $(document).on("click", "#image-overlay", function () {
                $(this).removeClass("open");
            });
            $(document).on("keydown", function (e) {
                if (e.key === "Escape") $("#image-overlay").removeClass("open");
            });
            $('a[href^="#"]').click(function () {
                $root.animate({
                    scrollTop: $($.attr(this, 'href')).offset().top
                }, 3000);

                return false;
            });
            $("img").attr('draggable', 'False');
        });
    </script>
</head>

<body>
